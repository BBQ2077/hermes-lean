name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile
        run: python -m py_compile apply_compact.py compact_ui.py tests/test_security.py tests/test_ui_security.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
